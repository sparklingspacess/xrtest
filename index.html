<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

log('H264 decoder config probe...');
log('');

const configs = [
    { codec: 'avc1.42001e', codedWidth: 16, codedHeight: 16 },
    { codec: 'avc1.42001e', codedWidth: 32, codedHeight: 32 },
    { codec: 'avc1.42c01e', codedWidth: 16, codedHeight: 16 },
    { codec: 'avc1.42c01e', codedWidth: 32, codedHeight: 32 },
    { codec: 'avc1.42001e', codedWidth: 16, codedHeight: 16, hardwareAcceleration: 'prefer-hardware' },
    { codec: 'avc1.42001e', codedWidth: 16, codedHeight: 16, hardwareAcceleration: 'prefer-software' },
    { codec: 'avc1.42001e', codedWidth: 64, codedHeight: 64 },
    { codec: 'avc1.640028', codedWidth: 16, codedHeight: 16 },
    { codec: 'avc1.4d001e', codedWidth: 16, codedHeight: 16 },
];

configs.forEach(cfg => {
    VideoDecoder.isConfigSupported(cfg).then(s => {
        log((s.supported ? '[YES]' : '[NO] ') + ' ' + JSON.stringify(cfg));
    }).catch(e => {
        log('[ERR] ' + JSON.stringify(cfg) + ' — ' + e.message);
    });
});
</script>
</body>
</html>
