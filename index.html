<!doctype html>
<html>
<head><title>Journey</title></head>
<body style="background:#000;color:#FFF;font-family:monospace;font-size:12px;padding:0px;">
<div id="out"></div>
<div style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <img src="oculus.png">
    <button id="exploitButton">
        Start Exploit
    </button>
</div>
<script>
const out = document.getElementById('out');
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };
log('journey web vuln (oct 3rd 2026)');
const button = document.getElementById('exploitButton');
const hoverSound = new Audio('sfx_hover.ogg');
const pressSound = new Audio('sfx_release_main.ogg');
hoverSound.preload = 'auto';
pressSound.preload = 'auto';
let audioUnlocked = false;
let fuckingAround = false;
document.addEventListener('pointerdown', () => {
    if (audioUnlocked)
    {
        return;
    }
    hoverSound.volume = 0;
    hoverSound.play().then(() => { hoverSound.pause(); hoverSound.currentTime = 0; hoverSound.volume = 1; audioUnlocked = true; }).catch(() => {});
}, { once: true });
button.addEventListener('mouseenter', () => {
    if (!audioUnlocked)
    {
        return;
    }
    hoverSound.currentTime = 0;
    hoverSound.play();
});
button.addEventListener('mousedown', () => {
    pressSound.currentTime = 0;
    pressSound.play();
});
button.addEventListener('click', () => {
    if (!fuckingAround)
    {
        fuckingAround = true;
        alert('Exploit starting now, sit tight.\n\nYour headset may encounter issues during this.\nIf so, please reboot your headset and try again.\n\nIn no way is this root, this is a PoC for exploits\nwithin the Quest Browser and is still limited in terms of power.\n\nThis is an adaptation from a PoC for CVE-2026-95380 \n\nTHIS WILL LIKELY BE PATCHED SOON\nDO WITH THAT AS YOU WILL');
    }
});
</script>

</body>
</html>
